      }

      function add(name,iconName,owned,needed,unit) {
        const short = owned < needed - 1e-7;
        const badge = short ? fmt(owned) + "/" + fmt(needed) : fmt(needed);
        const units = unit === "mL" ? " mL" : unit === "quality" ? " pts" : "";
        const details = [name, badge + units + (short ? " owned/needed" : " needed")];
        if (ingredient.kept) details.push("retained");
        if (ingredient.quality && !liquid && (ingredient.strength ?? 1) !== 1)
          details.push(ingredient.name + " ≥ " + fmt(ingredient.strength));
        if (ingredient.minCondition != null) details.push("condition ≥ " + fmt(100 * ingredient.minCondition) + "%");
        if (ingredient.maxCondition != null) details.push("condition < " + fmt(100 * ingredient.maxCondition) + "%");
        if (liquid) details.push("one container");
        const hover=[name];
        if(units)hover.push(fmt(needed)+units);
        if(ingredient.kept)hover.push("retained tool");
        if(ingredient.minCondition>0)hover.push("≥"+fmt(100*ingredient.minCondition)+"%");
        if(ingredient.maxCondition!=null)hover.push("<"+fmt(100*ingredient.maxCondition)+"%");
        groups[index].push({name,iconName,owned,needed,unit,short,badge,hoverLabel:hover.join(" · "),tooltip:details.join(" · "),
          iconFallback: ingredient.exampleName || options[0]?.name});
      }

      if (!ingredient.quality) {
        add(ingredient.name,ingredient.name,total,ingredient.amount,ingredient.unit);
      } else if (line.ok) {
        for (const [name,used] of usedByName) add(name,name,ownedByName.get(name) || 0,used,ingredient.unit);
      } else {
        add("Any " + ingredient.name.toLowerCase(), "quality:" + ingredient.name, total,
          ingredient.amount, liquid ? "quality" : ingredient.unit);
      }
    }
    return {entries: groups.flat(), related};
  }

// Pick one connected ingredient pocket for the largest expected bill, then reuse
// its first cells for smaller bills. Coordinates are relative to each recipe strip.
function makeIngredientSpace(strips, maxCount = 9) {
  const empty = { cells: [], extraRows: 0 };
  if (!strips.length) return () => empty;
  const last = strips.length - 1, tail = strips[last];
  const directions = [[0,-1],[-1,0],[1,0],[0,1]];
  const id = (s,x,y) => s + "," + x + "," + y;
  const all = new Map(), anchors = [], tops = [];
  let top = 0;
  for (const strip of strips) {
    tops.push(top);
    for (const p of strip.occupied) anchors.push([p.x,top+p.y]);
    top += strip.height + 0.2;
  }
  function add(s,x,y) {
    const key = id(s,x,y);
    let squared = Infinity;
    for (const [ax,ay] of anchors)
      squared = Math.min(squared,(ax-x)**2 + (ay-tops[s]-y)**2);
    const cell = {strip:s,x,y,key,clearance:Number.isFinite(squared)?Math.sqrt(squared):0};
    all.set(key,cell);
    return cell;
  }
  for (const [s,strip] of strips.entries()) {
    const used = new Set(strip.occupied.map(p => id(s,p.x,p.y)));
    for (let y=0;y<strip.height;y++) for (let x=0;x<strip.width;x++)
      if (!used.has(id(s,x,y))) add(s,x,y);
  }
  const neighbors = c => directions.map(([dx,dy]) => all.get(id(c.strip,c.x+dx,c.y+dy))).filter(Boolean);
  const seen = new Set(), regions = [];
  for (const cell of all.values()) {
    if (seen.has(cell)) continue;
    const group = [cell];
    seen.add(cell);
    for (let i=0;i<group.length;i++) for (const next of neighbors(group[i])) {
      if (seen.has(next)) continue;
      seen.add(next);
      group.push(next);
    }
    regions.push(group);
  }

  // Grow edge by edge. A compact bounding box and shared sides prevent thin
  // tendrils; when shapes are similar, use the cells farther from nearby recipes.
  function grow(group, initial, count) {
    const allowed = new Set(group), selected = new Set(initial), edge = new Set();
    const result = initial.slice();
    let left=Infinity, right=-Infinity, top=Infinity, bottom=-Infinity;
    function visit(c) {
      left=Math.min(left,c.x); right=Math.max(right,c.x);
      top=Math.min(top,c.y); bottom=Math.max(bottom,c.y);
      for (const n of neighbors(c)) if (allowed.has(n) && !selected.has(n)) edge.add(n);
    }
    for (const c of initial) visit(c);
    while (result.length<count && edge.size) {
      let winner, best=-Infinity;
      for (const c of edge) {
        const w=Math.max(right,c.x)-Math.min(left,c.x)+1;
        const h=Math.max(bottom,c.y)-Math.min(top,c.y)+1;
        const faces=neighbors(c).filter(n=>selected.has(n)).length;
        const score=2*faces - w*h - 0.75*Math.abs(w-h) + 0.32*c.clearance;
        if (score>best) {winner=c;best=score;}
      }
      edge.delete(winner); selected.add(winner); result.push(winner); visit(winner);
    }
    return result;
  }
  function choose(groups, count) {
    let best=-Infinity, result;
    for (const group of groups) {
      if (group.length<count) continue;
      for (const seed of group) {
        const cells=grow(group,[seed],count);
        const clear=cells.map(c=>c.clearance), xs=cells.map(c=>c.x), ys=cells.map(c=>c.y);
        const w=Math.max(...xs)-Math.min(...xs)+1, h=Math.max(...ys)-Math.min(...ys)+1;
        const score=Math.min(...clear) + clear.reduce((a,b)=>a+b,0)/count
          - 0.85*(w*h/count-1) - 0.14*Math.abs(w-h) + 0.025*seed.clearance;
        if (score>best) {best=score;result={group,cells};}
      }
    }
    return result;
  }

  const capacity = regions.reduce((n,g) => Math.max(n,g.length),0);
  let home;
  if (capacity) home=choose(regions,Math.min(capacity,Math.max(1,maxCount)));
  const baseByGroup = new Map();
  function basePath(count) {
    // Counts beyond the caller's expected maximum can still use another
    // existing pocket if the originally selected one is too small.
    let pick=home;
    if (count>home.group.length) {
      if (!baseByGroup.has(count)) baseByGroup.set(count,choose(regions,count));
      pick=baseByGroup.get(count);
    }
    if (pick.cells.length<count) pick.cells=grow(pick.group,pick.cells,count);
    return pick.cells;
  }

  const touching=regions.filter(g => g.some(c=>c.strip===last && c.y===tail.height-1));
  const firstRowCapacity=tail.width+touching.reduce((n,g)=>n+g.length,0);
  let overflow;
  function overflowPath(count) {
    if (!overflow) {
      const row=Array.from({length:tail.width},(_,x)=>add(last,x,tail.height));
      const previous=capacity ? basePath(capacity) : [];
      // All bottom-touching pockets join when the first new row is present.
      const area=touching.flat().concat(row);
      const initial=previous.length && area.includes(previous[0]) ? previous : [row[0]];
      overflow=grow(area,initial,firstRowCapacity);
    }
    // All cells of an added row are exhausted before opening the next one.
    while (overflow.length<count) {
      const afterFirst=overflow.length-firstRowCapacity;
      overflow.push({strip:last,x:afterFirst%tail.width,y:tail.height+1+Math.floor(afterFirst/tail.width)});
    }
    return overflow;
  }

  const cache=new Map();
  return function place(count) {
    if (!count) return empty;
    if (cache.has(count)) return cache.get(count);
    const path=count<=capacity ? basePath(count) : overflowPath(count);
    const extraRows=count<=capacity ? 0 : 1+Math.max(0,Math.ceil((count-firstRowCapacity)/tail.width));
    const cells=path.slice(0,count).map(({strip,x,y})=>({strip,x,y}));
    const placement={cells,extraRows};
    cache.set(count,placement);
    return placement;
  };
}

  const hoverName=$(".hovername"), desk=$(".craftdesk");
  let nameAnchor=null;

  function hideName(anchor) {
    if(anchor && anchor!==nameAnchor)return;
    nameAnchor=null;
    hoverName.hidden=true;
  }
  function positionName() {
    if(!nameAnchor)return;
    if(!board.contains(nameAnchor)){hideName();return;}
    const surface=desk.getBoundingClientRect(), anchor=nameAnchor.getBoundingClientRect();
    const label=hoverName.getBoundingClientRect();
    const clamp=(v,lo,hi)=>Math.max(lo,Math.min(v,hi));
    const x=clamp(anchor.left+(anchor.width-label.width)/2,surface.left+2,surface.right-label.width-2);
    const y=anchor.top-label.height-1;
    hoverName.style.left=Math.round(x-surface.left)+"px";
    hoverName.style.top=Math.round(y-surface.top)+"px";
  }
  function showName(anchor) {
    nameAnchor=anchor;
    hoverName.textContent=anchor.dataset.hoverName;
    hoverName.hidden=false;
    positionName();
  }
  function bindHoverName(node) {
    node.addEventListener("pointerenter",e=>{if(e.pointerType!=="touch")showName(node);});
    node.addEventListener("pointerleave",e=>{if(e.pointerType!=="touch")hideName(node);});
    node.addEventListener("focus",()=>showName(node));
    node.addEventListener("blur",()=>hideName(node));
    node.addEventListener("click",()=>showName(node));
  }
  document.addEventListener("keydown",e=>{if(e.key==="Escape")hideName();});
  document.addEventListener("pointerdown",e=>{if(nameAnchor && !nameAnchor.contains(e.target))hideName();});

  function refresh() {
    evaluations.clear();
    for (const r of recipes) {
      const evaluation=plan(r);
      evaluations.set(r.id,evaluation);
      const tile=tiles.get(r.id);
      if (!tile) continue;
      const state=evaluation.state, known=state!=="unknown";
      if (known && !tile.querySelector(".sprite")) {
        tile.replaceChildren();
        showIcon(tile,r);
      } else if (!known) tile.textContent="×";
      const count=showCounts.checked?craftableCount(r,evaluation):0;
      tile.dataset.state=state;
      if(known) {
        tile.dataset.category=r.category;
        const amounts=tile.querySelector(".amounts")||make(tile,"span","amounts");
        const display=count===Infinity?"∞":String(count);
        if(amounts.dataset.count!==display){
          amounts.dataset.count=display;
          amounts.setAttribute("aria-hidden","true");
          amounts.replaceChildren();
          if(count>0)make(amounts,"span","capacity",display);
        }
      } else delete tile.dataset.category;
      tile.dataset.hoverName=known?r.label+" · "+r.category:"Unknown recipe";
      tile.setAttribute("aria-disabled",String(state==="blocked"||!known));
      const status=state==="ready"?"ready to craft":state==="risk"?"risky craft":"unavailable";
      tile.setAttribute("aria-label",known ? r.label+", "+r.category+", INT "+r.level+", "+status+", "+
        (r.repair?"repairs ":"makes ")+qty(r.amount,r.unit)+
        (count>0?", "+(count===Infinity?"unlimited":String(count))+" craft "+(count===1?"attempt":"attempts")+" available":"") : "Unknown recipe");
    }
    paintHover();
  }
  function badgeText(el,entry) {
    el.textContent=entry.badge;
    el.classList.toggle("short",entry.short);
    if(entry.badge.length<5)return;
    el.classList.toggle("long",true);
    const [have,need]=entry.badge.split("/");
    el.style.setProperty("--badge-chars",String(need?Math.max(have.length+1,need.length):have.length));
    if(need)el.replaceChildren(document.createTextNode(have+"/"),document.createElement("wbr"),document.createTextNode(need));
  }
  function paintInputs(entries) {
    if(nameAnchor && transientTiles.includes(nameAnchor))hideName();
    for(const node of transientTiles)node.remove();
    transientTiles.length=0;
    const {cells}=placeInputs(entries.length);
    for(const [n,entry] of entries.entries()){
      const {strip,x,y}=cells[n], chip=make(stripsForInputs[strip],"div","loose");
      chip.setAttribute("role","img");
      chip.setAttribute("aria-label",entry.tooltip);
      chip.dataset.name=entry.name;
      chip.dataset.category=ingredientCategory(entry)||"Materials";
      chip.dataset.hoverName=entry.hoverLabel;
      bindHoverName(chip);
      chip.style.gridColumn=String(x+1);
      chip.style.gridRow=String(y+1);
      showIcon(chip,entry);
      badgeText(make(chip,"span","qty"),entry);
      transientTiles.push(chip);
    }
  }
  function paintHover() {
    const recipe=byId.get(activeId), evaluation=evaluations.get(activeId);
    const known=Boolean(recipe && evaluation && evaluation.state!=="unknown");
    const view=known?requirementView(recipe,evaluation):{entries:[],related:new Set()};
    for(const [id,tile] of tiles) {
      const selected=known && id===activeId, related=view.related.has(id);
      tile.classList.toggle("target",selected);
      tile.classList.toggle("related",related);
      const level=tile.querySelector(".intlevel"), amount=tile.querySelector(".yield");
      if(!selected) {
        if(level)level.remove();
        if(amount)amount.remove();
        tile.removeAttribute("aria-describedby");
        continue;
      }
      const intLabel=level||make(tile,"span","intlevel");
      intLabel.textContent="INT "+recipe.level;
      intLabel.dataset.risk=evaluation.gap<=0?"safe":evaluation.gap<=3?"risky":"locked";
      const yieldLabel=amount||make(tile.querySelector(".amounts"),"span","yield");
      yieldLabel.textContent=recipe.unit==="mL"?fmt(recipe.amount)+" mL":"×"+fmt(recipe.amount);
      intLabel.setAttribute("aria-hidden","true");yieldLabel.setAttribute("aria-hidden","true");
      tile.setAttribute("aria-describedby","cu-modref-requirements");
    }
    $(".readout").textContent=known?view.entries.map(i=>i.tooltip).join(". "):"";
    paintInputs(view.entries);
  }
  function inspect(id) {
    if(id===activeId)return;
    activeId=id;
    $(".failure").textContent="";
    paintHover();
  }

  function craft(r){
    const p=plan(r);
    if(p.state==="unknown"||p.state==="blocked"){paintHover();return;}
    spendIngredients(stock,p);
    stock=stock.filter(l=>l.n>1e-7);
    const penalty=p.state==="risk"&&Math.random()<.5;
    const failed=penalty && p.gap>=2;
    $(".failure").textContent=failed?"Attempt failed · ingredients spent"+(p.gap===3?" · hand injury":"")+".":"";
    if(!failed){
      const factor=penalty ? .2+.7*Math.random() : 1;
      const out=r.unit==="mL"?Math.round(r.amount*factor*10)/10:r.amount;
      const condition=r.unit==="mL"?1:(r.outputCondition??1)*factor;
      addStock(r.name,out,r.unit,condition);
    }
    refresh();
  }
  function coords(lo,hi,w){
    let y=0, list=[];
    for(const category of categories){
      const items=recipes.filter(r=>r.category===category && r.level>=lo && r.level<=hi)
                         .sort((a,b)=>a.level-b.level||a.label.localeCompare(b.label,"en"));
      items.forEach((r,n)=>list.push({r,x:n%w,y:y+Math.floor(n/w)}));
      y+=Math.ceil(items.length/w);
    }
    return list;
  }

  function draw(force=false) {
    const width=board.getBoundingClientRect().width;
    if(width<1)return;
    const min=window.matchMedia("(pointer: coarse)").matches?44:37;
    const maxCols=Math.max(2,Math.floor((width+2)/(min+2)));
    const totalColumns=bands.reduce((n,b)=>n+b[2],0);
    const columns=Math.min(totalColumns,maxCols);
    board.style.setProperty("--tile-side",Math.max(1,(width-2*(columns-1))/columns)+"px");
    if(!force && widthKey===columns){positionName();return;}
    hideName();
    widthKey=columns;board.replaceChildren();tiles.clear();activeId=null;
    transientTiles.length=0;stripsForInputs=[];
    const geometry=[];
    let strip,occupied,offset=0,height=0;
    function startStrip() {
      strip=make(board,"div","strip");
      strip.style.gridTemplateColumns="repeat("+columns+",minmax(0,1fr))";
      stripsForInputs.push(strip);
      occupied=[];offset=0;height=0;
    }
    startStrip();
    for(const [lo,hi,w] of bands){
      if(offset+w>columns) {
        geometry.push({width:columns,height,occupied});
        startStrip();
      }
      for(const {r,x,y} of coords(lo,hi,w)){
        const column=offset+x;
        occupied.push({x:column,y});height=Math.max(height,y+1);
        const tile=make(strip,"button","tile cursor-interaction");
        tile.type="button";tile.style.gridColumn=String(column+1);tile.style.gridRow=String(y+1);
        tile.dataset.recipeId=r.id;tiles.set(r.id,tile);
        tile.addEventListener("pointerenter",e=>{if(e.pointerType!=="touch")inspect(r.id);});
        tile.addEventListener("focus",()=>inspect(r.id));
        tile.addEventListener("click",()=>{inspect(r.id);craft(r);});
        bindHoverName(tile);
      }
      offset+=w;
    }
    geometry.push({width:columns,height,occupied});
    const maxInputs=recipes.reduce((n,r)=>Math.max(n,r.ingredients.length),0);
    placeInputs=makeIngredientSpace(geometry,maxInputs);
    refresh();
  }
  function leaveBoard() {
    hideName();
    if(activeId===null)return;
    activeId=null;
    paintHover();
  }
  board.addEventListener("pointerleave",e=>{
    if(e.pointerType==="touch")return;
    const focused=board.querySelector(".tile:focus-visible");
    if(focused){inspect(focused.dataset.recipeId);showName(focused);}
    else leaveBoard();
  });
  board.addEventListener("focusout",e=>{if(!board.contains(e.relatedTarget))leaveBoard();});
  for(let i=0;i<=18;i++){const o=make(intpick,"option","",String(i));o.value=String(i);}
  showCounts.addEventListener("change",refresh);
  intpick.addEventListener("change",()=>{
    hideName();intelligence=Number(intpick.value);gainKnowledge(intelligence);
    activeId=null;$(".failure").textContent="";refresh();
  });
  $(".reset").addEventListener("click",()=>{hideName();seed();activeId=null;$(".failure").textContent="";refresh();});
  seed();draw();
  if(typeof ResizeObserver!=="undefined")new ResizeObserver(()=>draw()).observe(board);
})();
</script>
</main></body>
